name: Update Wasm yarn.lock

on:
  schedule:
    # Offset from the top of the hour because GitHub drops or delays scheduled
    # runs that land in its busiest windows.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, because concurrent runs would race each other force
# pushing the same pull request branch.
concurrency:
  group: update-wasm-yarn-lock
  cancel-in-progress: false

jobs:
  update:
    name: Update Wasm yarn.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "jetbrains"
        # The JetBrains distribution resolves its version via the GitHub API;
        # authenticate so it isn't throttled by the 60 req/hour/IP limit.
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Resolve Wasm yarn.lock from scratch
        run: |
          rm -f kotlin-js-store/wasm/yarn.lock build/wasm/yarn.lock
          ./gradlew kotlinWasmUpgradeYarnLock

      - name: Check for changes
        id: lock
        run: |
          if git diff --quiet -- kotlin-js-store/wasm/yarn.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}

      - name: Close outdated pull request
        if: steps.lock.outputs.changed != 'true'
        run: |
          number="$(gh pr list --head chore/update-wasm-yarn-lock --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr close "$number" --delete-branch --comment "Closing because main already has the Wasm yarn.lock that a fresh resolve produces today."
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}

      # The pull request is opened with the App token rather than the default
      # GITHUB_TOKEN, so that the CI/CD workflow actually runs on it and the
      # refreshed lock file gets verified before merging.
      - name: Create pull request
        id: pull-request
        if: steps.lock.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: kotlin-js-store/wasm/yarn.lock
          branch: chore/update-wasm-yarn-lock
          commit-message: "build(deps): update Wasm yarn.lock"
          # Route the commit through the API so it is attributed to the App and
          # signed, instead of to whoever happens to trigger the run.
          sign-commits: true
          title: "build(deps): update Wasm yarn.lock"
          body: |
            The Wasm target resolves its npm dependencies through `kotlin-js-store/wasm/yarn.lock`. This pull request deletes that lock file, resolves it again with `./gradlew kotlinWasmUpgradeYarnLock`, and was opened automatically because the result differs from main.

            Deleting the lock file first is what picks up newer releases within the declared version ranges. Running the upgrade task on the stored lock file only reconciles it with the declared dependencies.
          labels: dependencies

      - name: Enable auto-merge
        if: steps.pull-request.outputs.pull-request-operation == 'created'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
